<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <g filter="url(#shadow)">
    <!-- クリップボード背景 -->
    <rect x="116" y="110" width="280" height="320" rx="32" fill="#ffffff"/>
    <!-- クリップ上部 -->
    <rect x="186" y="80" width="140" height="50" rx="16" fill="#0f766e"/>
    <circle cx="256" cy="105" r="10" fill="#ffffff"/>
    
    <!-- 医療クロス記号 -->
    <g transform="translate(256, 230)">
      <rect x="-14" y="-45" width="28" height="90" rx="8" fill="#0d9488"/>
      <rect x="-45" y="-14" width="90" height="28" rx="8" fill="#0d9488"/>
      <circle cx="0" cy="0" r="12" fill="#ffffff"/>
    </g>
    
    <!-- レコード行 -->
    <rect x="166" y="305" width="180" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="166" y="340" width="130" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="166" y="375" width="150" height="18" rx="9" fill="#0d9488" fill-opacity="0.7"/>
  </g>
</svg>
